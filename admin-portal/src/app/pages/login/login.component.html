<div class="login-page">
  <form class="card login-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="login-brand">
      <img src="assets/logo.jpg" alt="Shalini Crackers" />
    </div>
    <p class="eyebrow">Shalini Crackers Admin</p>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to manage your storefront.</p>

    <div class="form-row">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="username" />
      <p class="error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
        Enter a valid email address.
      </p>
    </div>

    <div class="form-row">
      <label for="password">Password</label>
      <div class="password-field">
        <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
        <button type="button" class="password-toggle" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
          {{ showPassword ? 'Hide' : 'Show' }}
        </button>
      </div>
      <p class="error" *ngIf="form.controls.password.touched && form.controls.password.invalid">
        Password must be at least 6 characters.
      </p>
    </div>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" class="btn login-submit" [disabled]="loading">
      {{ loading ? 'Logging in…' : 'Log In' }}
    </button>
  </form>
</div>
