<section class="container" style="padding: 24px 0;">
  <h1>Products</h1>

  <div class="filters">
    <input
      type="text"
      placeholder="Search products…"
      [(ngModel)]="searchTerm"
      (keyup.enter)="onSearch()"
      name="search"
    />
    <button class="btn" (click)="onSearch()">Search</button>
  </div>

  <div class="category-chips">
    <button
      class="chip"
      [class.active]="!activeCategory"
      (click)="selectCategory('')"
    >All</button>
    <button
      *ngFor="let c of categories"
      class="chip"
      [class.active]="activeCategory === c.slug"
      (click)="selectCategory(c.slug)"
    >{{ c.name }}</button>
  </div>

  <p *ngIf="loading">Loading products…</p>
  <p *ngIf="!loading && products.length === 0">No products found.</p>

  <div class="product-grid" *ngIf="!loading">
    <div *ngFor="let p of products" class="card product-card">
      <a [routerLink]="['/products', p.slug]" class="product-media-link" [attr.aria-label]="(p.youtubeVideoUrl ? 'Watch video and view details for ' : 'View details for ') + p.name">
        <img *ngIf="p.imageUrl" [src]="resolveImageUrl(p.imageUrl)" [alt]="p.name" />
        <span *ngIf="p.youtubeVideoUrl" class="video-badge" aria-hidden="true">▶ Video</span>
        <span class="media-overlay"><span>{{ p.youtubeVideoUrl ? 'Watch video & details' : 'View details' }}</span><span aria-hidden="true">→</span></span>
      </a>
      <div class="body">
        <h3>{{ p.name }}</h3>
        <span *ngIf="p.priceMode === 'offer'" class="offer-badge">Festival Offer</span>
        <div *ngIf="p.showPrice" class="price-row">
          <del *ngIf="p.priceMode === 'offer' && getOriginalPrice(p) != null && getDisplayPrice(p) !== '₹' + getOriginalPrice(p)" class="original-price">₹{{ getOriginalPrice(p) }}</del>
          <span class="price">{{ getDisplayPrice(p) }}</span>
          <span *ngIf="getSavings(p) != null" class="saving">Save ₹{{ getSavings(p) }}</span>
        </div>
        <div class="product-card-actions">
          <div class="selection-summary">
            <app-quantity-selector [quantity]="getQuantity(p)" [min]="0" (quantityChange)="setQuantity(p, $event)"></app-quantity-selector>
            <div class="selected-total"><span>Selected total</span><strong>₹{{ getSelectedTotal(p) | number:'1.2-2' }}</strong></div>
          </div>
          <button type="button" class="btn add-to-cart" [disabled]="getQuantity(p) === 0" (click)="addToCart(p)">{{ getQuantity(p) ? 'Add ' + getQuantity(p) + ' to Cart' : 'Select Quantity' }}</button>
        </div>
      </div>
    </div>
  </div>
</section>
